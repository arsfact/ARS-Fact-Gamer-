
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARS Fact Gamer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
}

header {
    padding: 25px 10px;
    margin-bottom: 25px;
    border-bottom: 2px solid #ff3030;
}

.logo {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 55px;
    height: 55px;
    background: #ff2525;
    border-radius: 14px;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 12px;
    box-shadow: 0 0 20px #ff2525;
}

h1 {
    font-size: 30px;
    color: #ff3333;
    text-shadow: 0 0 12px #ff2222;
}

.subtitle {
    color: #ffffff;
    letter-spacing: 5px;
    font-size: 14px;
    margin-top: 8px;
}

.info {
    background: #171717;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 22px;
}

.info h2 {
    color: #ff3838;
    font-size: 21px;
    margin-bottom: 12px;
}

.info p {
    color: #cccccc;
    line-height: 1.6;
    font-size: 14px;
}

.video-box {
    width: 100%;
    overflow: hidden;
    border-radius: 14px;
    border: 2px solid #ff3030;
    box-shadow: 0 0 18px #ff252555;
    margin: 20px 0;
}

.video-box iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    border: none;
}

.install-btn {
    display: block;
    background: #ff2525;
    color: white;
    text-decoration: none;
    padding: 16px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
    margin: 20px 0;
    box-shadow: 0 0 18px #ff252577;
    transition: 0.3s;
}

.install-btn:hover {
    background: #d90000;
    transform: scale(1.03);
}

.whatsapp-btn {
    display: block;
    background: #168c45;
    color: white;
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    margin-top: 12px;
}

footer {
    color: #888;
    font-size: 12px;
    margin-top: 30px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">FF</div>
    <h1>ARS Fact Gamer</h1>
    <div class="subtitle">FREE FIRE</div>
</header>

<div class="info">
    <h2>WELCOME TO ARS FACT GAMER</h2>
    <p>
        Welcome to our gaming website.
        Watch the video below and visit our
        WhatsApp channel for updates.
    </p>
</div>

<div class="video-box">
    <iframe
        src="https://www.youtube-nocookie.com/embed/iNpvMQEQQYk"
        title="ARS Fact Gamer YouTube Video"
        allowfullscreen>
    </iframe>
</div>

<a class="install-btn"
   href="https://whatsapp.com/channel/0029Vb5p1agI7Be5xMceCr1B"
   target="_blank"
   rel="noopener">
   INSTALL NOW
</a>

<a class="whatsapp-btn"
   href="https://whatsapp.com/channel/0029Vb5p1agI7Be5xMceCr1B"
   target="_blank"
   rel="noopener">
   JOIN WHATSAPP CHANNEL
</a>

<footer>
    Fan-made gaming information page.
    Not affiliated with Garena or Free Fire.
</footer>

</div>

</body>
</html>
